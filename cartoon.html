<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Galaxy Animation</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at center, #172554 0%, #080d24 45%, #020617 100%);
      font-family: Arial, sans-serif;
    }

    h1 {
      position: fixed;
      top: 24px;
      z-index: 2;
      margin: 0;
      color: #e0f2fe;
      letter-spacing: 4px;
      text-shadow: 0 0 14px #60a5fa;
    }

    .galaxy {
      position: relative;
      width: min(76vw, 500px);
      aspect-ratio: 1;
      border-radius: 50%;
      animation: rotate 22s linear infinite;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75px;
      height: 75px;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      background: #fff7ed;
      box-shadow: 0 0 25px 12px #fbbf24, 0 0 70px 35px #a855f7;
    }

    .ring {
      position: absolute;
      top: 50%;
      left: 50%;
      border: 2px solid rgba(147, 197, 253, 0.5);
      border-radius: 50%;
      transform: translate(-50%, -50%) rotateX(68deg);
      box-shadow: 0 0 12px #a855f7 inset, 0 0 10px #60a5fa;
    }

    .ring.one {
      width: 260px;
      height: 260px;
    }

    .ring.two {
      width: 390px;
      height: 390px;
      transform: translate(-50%, -50%) rotateX(68deg) rotate(50deg);
    }

    .star {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 10px 3px #bae6fd;
      transform-origin: 0 0;
    }

    .star:nth-child(4) {
      transform: rotate(10deg) translateX(130px);
    }

    .star:nth-child(5) {
      transform: rotate(55deg) translateX(190px);
      background: #f0abfc;
    }

    .star:nth-child(6) {
      transform: rotate(110deg) translateX(155px);
      background: #fde68a;
    }

    .star:nth-child(7) {
      transform: rotate(155deg) translateX(215px);
    }

    .star:nth-child(8) {
      transform: rotate(205deg) translateX(125px);
      background: #c4b5fd;
    }

    .star:nth-child(9) {
      transform: rotate(250deg) translateX(200px);
    }

    .star:nth-child(10) {
      transform: rotate(300deg) translateX(160px);
      background: #fda4af;
    }

    .star:nth-child(11) {
      transform: rotate(340deg) translateX(225px);
    }

    .space-star {
      position: fixed;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: white;
      box-shadow: 0 0 7px white;
      animation: twinkle 1.6s infinite alternate;
    }

    .space-star:nth-of-type(1) {
      top: 12%;
      left: 10%;
    }

    .space-star:nth-of-type(2) {
      top: 25%;
      left: 80%;
      animation-delay: .5s;
    }

    .space-star:nth-of-type(3) {
      top: 72%;
      left: 15%;
      animation-delay: 1s;
    }

    .space-star:nth-of-type(4) {
      top: 84%;
      left: 82%;
      animation-delay: .3s;
    }

    .space-star:nth-of-type(5) {
      top: 46%;
      left: 92%;
      animation-delay: .9s;
    }

    .space-star:nth-of-type(6) {
      top: 9%;
      left: 55%;
      animation-delay: .7s;
    }

    @keyframes rotate {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes twinkle {
      from {
        opacity: .2;
        transform: scale(.5);
      }

      to {
        opacity: 1;
        transform: scale(2);
      }
    }
  </style>
</head>

<body>
  <h1>GALAXY</h1>
  <div class="galaxy">
    <div class="ring one"></div>
    <div class="ring two"></div>
    <div class="center"></div>
    <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
    <span class="star"></span><span class="star"></span><span class="star"></span><span class="star"></span>
  </div>
  <i class="space-star"></i><i class="space-star"></i><i class="space-star"></i>
  <i class="space-star"></i><i class="space-star"></i><i class="space-star"></i>
</body>

</html>
